[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tower-knowledge-base"
version = "0.1.0"
description = "铁塔运维知识库本地开发基线"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
